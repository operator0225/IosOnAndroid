[package]
name = "iosonandroid-mkfixture"
description = "Builds minimal ARM64 Mach-O test fixtures from hand-assembled, verifiable machine code (no Apple-derived bytes)"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mkfixture"
path = "src/main.rs"

[lib]
name = "mkfixture"
path = "src/lib.rs"

[dependencies]
iosonandroid-loader = { path = "../../loader" }
